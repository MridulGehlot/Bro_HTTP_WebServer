<!DOCTYPE HTML>
<html>
<head>
<title>ES6 Features</title>
<script>
function feature1()
{
var v={
g:4900
};
var m=v.k || function()
{
return 280;
}
alert(m());
}
function feature2()
{
//IIFE:Immediately invoked function expression
(function(e)
{
alert('val = '+e);
})(10);
}
function sam(p=10,q=20,r=30)
{
alert(p+','+q+','+r);
}
function feature3()
{
sam(1000,2000,3000);
sam(50,100);
sam(1000);
sam();
}
function veryCool(p,q,r)
{
alert(p+','+q+','+r);
}
function feature4()
{
var a=[10,20,30];
veryCool(a);
veryCool(...a);
}
function superCool(...arr)
{
alert(arr);
alert(arr.length);
}
function feature5()
{
superCool(10,20,30,40,50);
}
function whatIsThis()
{
return [10,20,30];
}
function feature6()
{
var [a,b,c]=whatIsThis();
alert(a+","+b+","+c);

var [a,,c]=whatIsThis();
alert(a+","+c);

var [a,]=whatIsThis();
alert(a);
}
function feature7()
{
var b={
wattage:60,
setWattage(e){
this.wattage=e;
},
getWattage()
{
return this.wattage;
}
};
alert(b.wattage);
b.setWattage(290);
alert(b.getWattage());
}
function feature8()
{
var a=(p,q)=>p+q;
var b=()=>alert('working');
var c=(p,q)=>{
return p*q;
}
alert(a(10,20));
b();
alert(c(10,20));
}
</script>
</head>
<body>
<button onclick='feature1()'>1</button>
<button onclick='feature2()'>2</button>
<button onclick='feature3()'>3</button>
<button onclick='feature4()'>4</button>
<button onclick='feature5()'>5</button>
<button onclick='feature6()'>6</button>
<button onclick='feature7()'>7</button>
<button onclick='feature8()'>8</button>
</body>
</html>
