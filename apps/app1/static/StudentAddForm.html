<!DOCTYPE HTML>
<html lang='en'>
<meta charset='utf-8'>
<head>
<title>School</title>
<script>
function validate(frm)
{
var rollNumber=frm.rollNumber.value.trim();
if(rollNumber.length==0)
{
alert('Roll Number Required');
frm.rollNumber.focus();
return false;
}
var rl=parseInt(rollNumber);
if(isNaN(rl))
{
alert('Roll Number Should be an Integer');
frm.rollNumber.value='';
frm.rollNumber.focus();
return false;
}
var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz .';
var name=frm.name.value.trim();
if(name.length==0)
{
alert('Name Required');
frm.name.focus();
return false;
}
for(var i=0;i<name.length;i++)
{
if(chars.indexOf(name.charAt(i))==-1)
{
alert('Incorrect Name Format');
frm.name.value='';
frm.name.focus();
return false;
}
}
return true;
}
</script>
</head>
<body>
<h1>Student (Add Module)</h1>
<form action='/addStudent' onsubmit='return validate(this)'>
Roll Number : <input type="text" id='rollNumber' name='rollNumber'><br>
Name : <input type="text" id='name' name='name'><br>
Gender : &nbsp;&nbsp;&nbsp;
<input type='radio' name='gender' id='male' value='M' checked>
Male &nbsp;&nbsp;
<input type='radio' name='gender' id='female' value='F'>
Female
<br>
<button type='submit'>Save</button>
</form>
</body>
</html>
